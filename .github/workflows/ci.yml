name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          devbox-version: 0.17.2
          enable-cache: true
      - run: devbox run -- pnpm install --frozen-lockfile
      - run: devbox run -- pnpm format:check
      - run: devbox run -- pnpm lint
      - run: devbox run -- pnpm typecheck
      - run: devbox run -- pnpm test
      - run: devbox run -- pnpm build
